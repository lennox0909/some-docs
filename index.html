<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>文件解析器 (WebGPU)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
    .markdown-body h1 { font-size: 1.5em; }
    .markdown-body h2 { font-size: 1.25em; border-bottom: 1px solid #e5e7eb; padding-bottom: 0.3em; }
    .markdown-body table { border-collapse: collapse; width: 100%; margin-bottom: 1em; }
    .markdown-body th, .markdown-body td { border: 1px solid #d1d5db; padding: 8px; }
    .markdown-body th { background-color: #f9fafb; }
    .markdown-body ul, .markdown-body ol { padding-left: 1.5em; margin-bottom: 1em; }
    .markdown-body ul { list-style-type: disc; }
    .markdown-body ol { list-style-type: decimal; }
  </style>
</head>
<body class="bg-gray-100 p-6 min-h-screen">
  <div class="max-w-7xl mx-auto space-y-6">
    <header class="bg-white p-6 rounded-lg shadow-sm">
      <h1 class="text-2xl font-bold text-gray-800">文件解析器 <span class="text-sm font-normal text-gray-500 bg-gray-100 px-2 py-1 rounded">100% Local WebGPU</span></h1>
      <p class="text-sm text-gray-600 mt-2">資料不會離開您的設備。首次載入模型需下載快取，後續開啟即秒載入。</p>
    </header>
    
    <!-- 操作區塊 (加入模型選擇下拉選單) -->
    <div class="flex flex-col md:flex-row gap-4 items-center bg-white p-4 rounded-lg shadow-sm border border-gray-200">
      
      <div class="w-full md:w-1/3">
        <label for="modelSelect" class="block text-xs font-medium text-gray-700 mb-1">選擇視覺解析模型</label>
        <select id="modelSelect" class="block w-full rounded-md border-gray-300 bg-gray-50 border p-2 text-sm focus:border-blue-500 focus:ring-blue-500">
          <!-- 官方內建支援的視覺模型 -->
          <option value="Phi-3.5-vision-instruct-q4f16_1-MLC">Phi-3.5 Vision (輕量/約需 4GB VRAM)</option>
          <option value="Llama-3.2-11B-Vision-Instruct-q4f16_1-MLC">Llama-3.2 11B Vision (高準確/約需 8GB VRAM)</option>
        </select>
      </div>

      <div class="w-full md:w-1/3">
         <label for="imageInput" class="block text-xs font-medium text-gray-700 mb-1">上傳文件圖檔</label>
         <input type="file" id="imageInput" accept="image/*" class="block w-full text-sm text-gray-500 file:mr-4 file:py-1.5 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100" />
      </div>

      <div class="w-full md:w-auto md:ml-auto self-end">
        <button id="processBtn" class="w-full bg-blue-600 text-white px-8 py-2 rounded-md hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed font-medium transition-colors">
          開始解析
        </button>
      </div>
    </div>

    <!-- 狀態列 -->
    <div id="status" class="bg-gray-800 text-green-400 p-3 rounded-lg text-sm font-mono shadow-inner break-words">
      [System] 就緒。請選擇模型與圖片檔以開始。
    </div>

    <!-- 雙欄比對視窗 -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-[700px]">
        <h2 class="font-semibold p-4 border-b bg-gray-50 rounded-t-lg">原稿圖檔預覽</h2>
        <div class="p-4 overflow-auto flex-1 bg-gray-50/50 flex items-center justify-center">
          <span id="previewPlaceholder" class="text-gray-400">尚未載入圖片</span>
          <img id="preview" class="max-w-full h-auto hidden shadow-sm border border-gray-200" alt="Image preview" />
        </div>
      </div>
      
      <div class="bg-white rounded-lg shadow-sm border border-gray-200 flex flex-col h-[700px]">
        <h2 class="font-semibold p-4 border-b bg-gray-50 rounded-t-lg">解析結果 (即時 HTML 渲染)</h2>
        <div id="outputHtml" class="markdown-body p-6 overflow-auto flex-1 text-sm text-gray-800"></div>
      </div>
    </div>
  </div>

  <script type="module" src="./main.js"></script>
</body>
</html>
